<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.gcards{grid-template-columns:minmax(0,620px)!important;justify-content:center}
.sphoto{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;justify-content:center}.sphoto img{display:block;width:100%;max-width:560px;max-height:220px;object-fit:contain}
.gstage.photo img{object-fit:contain!important}
</style><meta name="theme-color" content="#0f1114"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GDL Workbook"></head><body>
<title>GDL Engineer Workbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: muretto box in livrea GDL Racing — grafite, rosso del logo, argento. */
:root{
  --bg:#0f1114; --surface:#181b20; --surface-2:#22262d; --line:#353b45;
  --fg:#f4f4f4; --muted:#a6aeb9; --accent:#e2231a; --accent-2:#c9ced6; --accent-ink:#ffffff;
  --ok:#3fd47c; --warn:#f2ad5c; --bad:#ff6b6b; --ok-bg:#0f3b2c; --warn-bg:#3b2f1b; --bad-bg:#3d1a24;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
body[data-team="fs"]{ --accent:#2ecf64; --accent-2:#ffffff; --accent-ink:#001533; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
header{display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;min-height:56px}
.logo img{display:block;height:52px;width:auto;max-width:100%}
body[data-team="fs"] .logo img{height:64px}
.teamsw{display:flex;gap:4px}
.teamsw button{border:1px solid var(--line);background:transparent;color:var(--muted);font:italic 700 16px var(--f-display);letter-spacing:.06em;padding:6px 14px;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);min-height:36px}
.teamsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:italic 800 34px/0.95 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}
.stripes{display:flex;gap:6px;height:8px}
.stripes i{display:block;height:100%;transform:skewX(-28deg)}
.stripes i:nth-child(1){width:46px;background:var(--accent-2)}
.stripes i:nth-child(2){width:46px;background:var(--accent)}
.stripes i:nth-child(3){flex:1;background:var(--line)}
.sync{font-size:12px;color:var(--muted);font-family:var(--f-num)}
h2{font:italic 700 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--bg);border-radius:4px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;color:var(--fg);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer;min-height:38px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=text]{font:500 16px var(--f-num);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:40px;width:100%}
select{font-family:var(--f-body)}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);font:italic 700 18px var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:8px 14px 10px;cursor:pointer;position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:4px;background:var(--accent);transform:skewX(-28deg)}
.panel{display:flex;flex-direction:column;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.car{display:grid;grid-template-columns:1fr 54px 1fr;grid-template-rows:auto auto;gap:10px;align-items:stretch}
.car .body{grid-column:2;grid-row:1/3;border:2px solid var(--line);border-radius:26px 26px 12px 12px;position:relative;background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.car .body::before{content:"";position:absolute;left:0;right:0;margin-inline:auto;top:calc(10% + 4px);bottom:12%;width:4px;background:var(--accent);border-radius:2px}
.car .body::after{content:"";position:absolute;left:0;right:0;margin-inline:auto;top:10%;width:18px;height:18px;border-left:4px solid var(--accent);border-top:4px solid var(--accent);border-radius:2px 0 0 0;transform:rotate(45deg)}
.tyre{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tyre .t-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tyre .name{font:italic 700 16px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.big{font:600 32px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.delta{font:500 12.5px var(--f-num);color:var(--muted)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini .field input{font-size:15px;min-height:36px;padding:6px 8px}
.chip{display:inline-block;font:600 11.5px var(--f-num);padding:2px 7px;border-radius:3px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px}
.note b{color:var(--fg)}
.btn{font:600 15px var(--f-body);border-radius:4px;padding:10px 18px;min-height:42px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-inline:24px;border-radius:0}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.hist{display:flex;flex-direction:column;gap:8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:6px}
.hcard .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;font:13px var(--f-num);font-variant-numeric:tabular-nums;width:100%}
th,td{padding:3px 6px;text-align:right;white-space:nowrap} th{color:var(--muted);font-weight:500;font-family:var(--f-body);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
td:first-child,th:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-weight:600;font-size:14px;z-index:20;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.muted{color:var(--muted)}
@media (max-width:420px){.car{grid-template-columns:1fr 22px 1fr}.car .body::after{width:10px;height:10px;border-width:3px}.car .body::before{top:calc(10% + 2px)}.big{font-size:27px}.logo img{height:40px}body[data-team="fs"] .logo img{height:52px}h1{font-size:29px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- modulo setup e calcolatore ---- */
:root{--chg:#f2ad5c;--chg-bg:#3b2f1b}
.mods{flex-wrap:nowrap}.mods button{font:italic 700 17px var(--f-display);text-transform:uppercase;letter-spacing:.04em;min-height:42px;padding-inline:8px;min-width:0}
@media (max-width:420px){.mods button{font-size:15px;letter-spacing:.02em}} @media (max-width:460px){.mods button{font-size:13px;letter-spacing:0;padding-inline:5px}}
.schips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.schips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:8px 16px;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);min-height:40px;display:inline-flex;align-items:center;gap:6px}
.schips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.schips .cnt{font:600 11px var(--f-num);background:var(--chg);color:#111;border-radius:3px;padding:0 5px}
.schips .add{color:var(--accent);border-style:dashed}
.shg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:6px}
.shg h3{font:italic 700 17px var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--accent)}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:start}
.srow.one{grid-template-columns:minmax(0,1.3fr) minmax(0,2fr)}
.slbl{font-size:13px;padding-top:9px;min-width:0}
.slbl .u{color:var(--muted);font-size:11px}
.scell{display:flex;flex-direction:column;gap:2px;min-width:0}
.scell input,.scell select{min-height:36px;padding:6px 8px;font-size:15px}
.scell.chg input,.scell.chg select{border-color:var(--chg);background:var(--chg-bg);font-weight:600}
.was{font:500 11px var(--f-num);color:var(--chg)}
.was:empty{display:none}
.chglist{background:var(--surface);border:1px solid var(--chg);border-radius:4px;padding:10px 12px}
.chglist .lbl{color:var(--chg)}
.chglist ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.chglist .to{color:var(--chg);font-weight:600}
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.tech>div{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
.tv{font:600 14px var(--f-num);margin-top:2px;overflow-wrap:anywhere}
.tv .warn{color:var(--warn)}
.evhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
textarea{width:100%;font:15px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;resize:vertical}
table.cmp td{white-space:normal}
table.cmp tr.chg td{color:var(--chg);font-weight:600}
.cgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.cgrid .slbl{padding-top:0}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ctile{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.ctile .big{font-size:28px}
.note.warn{border-color:var(--warn);color:var(--warn)}
.convgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr) minmax(0,2fr);gap:8px;align-items:center}
.convgrid label{font-size:13px}
.cres{font:500 13px var(--f-num);color:var(--muted)} .cres b{color:var(--fg)}
@media (max-width:520px){.convgrid{grid-template-columns:1fr 1fr}.convgrid .cres{grid-column:1/-1;margin-bottom:6px}}

/* ---- layout schermo largo e scheda turno a vettura ---- */
.wrap{max-width:1760px}
.brand{flex-wrap:wrap}
.titlebar{order:3;flex-basis:100%}
.controls{display:grid;gap:12px}
.pwide,.cwide{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.cgrid select,.cgrid input{min-width:0}
@media (max-width:520px){.cgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .cgrid>.slbl{grid-column:1/-1;margin-bottom:-4px} .cgrid>div:first-child{display:none} .vf{grid-template-columns:minmax(0,1fr) 90px}}
.pin,.cin{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){
  .titlebar{order:0;flex:1 1 auto;flex-basis:auto;justify-content:flex-start;gap:18px;align-items:baseline}
  .brand{flex-wrap:nowrap}
}
@media (min-width:1000px){
  .controls{grid-template-columns:minmax(380px,460px) 1fr;align-items:stretch}
  .mods{align-self:stretch}
  .sel{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;padding:10px 12px}
  .sel>.field{flex:0 1 auto}
  .sel>#trackWrap{flex:1 1 380px;flex-wrap:nowrap}
  .pwide{grid-template-columns:minmax(320px,1fr) minmax(0,1.5fr);align-items:start}
  .cwide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
}
/* scheda turno */
.evbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.evtitle{display:flex;flex-direction:column;min-width:0}
.evbar .schips{flex:1 1 300px;min-width:0}
.sesbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.sesact{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.chglist{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.chglist .lbl{flex-basis:100%}
.chgi{font-size:13.5px}
.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.col-l,.col-r,.col-c{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-c{grid-column:1/-1;order:-1}
@media (min-width:1180px){ .sheet{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr)} .col-c{grid-column:auto;order:0} }
.corner,.axle,.gen{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.corner h3,.axle h3,.gen h3{display:flex;align-items:center;gap:8px;margin:0 0 2px;font:italic 700 17px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--fg)}
.corner h3 span{font-style:normal;font:700 13px var(--f-num);background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:3px;letter-spacing:.04em}
.axle h3,.gen h3{color:var(--accent)}
.ncnt{margin-left:auto;font:600 12px var(--f-num);font-style:normal;background:var(--chg);color:#111;padding:1px 7px;border-radius:3px}
.fx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:8px;align-items:center;min-width:0}
.fl{font-size:13px;color:var(--fg)} .fl .u{color:var(--muted);font-size:11px}
.fi{display:flex;flex-direction:column;gap:2px;min-width:0}
.fi input,.fi select{min-height:34px;padding:5px 8px;font-size:15px}
.fx.chg .fi input,.fx.chg .fi select{border-color:var(--chg);background:var(--chg-bg);font-weight:600}
.fx.chg .fl{color:var(--chg)}
.axgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.axgrid .fx,.ggrid .fx{grid-template-columns:1fr;gap:3px}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.axinfo{font:500 12px var(--f-num);color:var(--muted)}
.gens{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.gen.notes textarea{min-height:120px}
.gens.top{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start}
.gen h3 .u{color:var(--muted);font:500 11px var(--f-body);text-transform:none;letter-spacing:0}
@media (max-width:699px){ .fx{grid-template-columns:1fr;gap:3px} .corner{padding:8px} .corner h3{font-size:15px} }
/* vettura */
.viz{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;display:grid;gap:10px}
.vtop svg{display:block;width:100%;max-width:420px;max-height:600px;margin:0 auto}
.vstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vstrip figure{margin:0;background:var(--bg);border-radius:4px;padding:6px 6px 2px;min-width:0}
.vstrip svg{display:block;width:100%}
figcaption{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
@media (min-width:700px){ .viz{grid-template-columns:minmax(0,1fr) minmax(0,.95fr);align-items:center} .vstrip{grid-template-columns:1fr} .vleg{grid-column:1/-1} }
@media (max-width:699px){ .vstrip{grid-template-columns:1fr 1fr} .vstrip figure:first-child{grid-column:1/-1} .vtop svg{max-height:440px} }
.viz .s1{stop-color:var(--surface-2)} .viz .s2{stop-color:var(--accent);stop-opacity:.45}
.viz .body{stroke:var(--accent);stroke-width:1.5}
.v-end .body,.v-side .body{fill:var(--surface-2)}
.viz .body.chg{stroke:var(--chg)}
.viz .pods{fill:var(--surface-2);stroke:var(--line)}
.viz .cockpit{fill:var(--bg);stroke:var(--line)}
.viz .halo{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.viz .wingp{fill:var(--accent-2)}
.viz .arms path,.viz .arms2{stroke:var(--muted);stroke-width:2;fill:none}
.viz .whl{fill:#0a0e14;stroke:var(--muted);stroke-width:1.5;transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.3,.7,.2,1),stroke .2s}
.viz .whl line{stroke:#2f343c}
.viz .whl.chg{stroke:var(--chg);stroke-width:2.5}
.viz .whl.e,.viz .ghost.e{transform-origin:center bottom}
.viz .ghost{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .45s}
.viz .ground{stroke:var(--line);stroke-width:2}
.viz .dim{stroke:var(--accent);stroke-width:2;stroke-dasharray:3 2}
.viz .ebody{transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.viz .floor{fill:var(--accent)} .viz .ebody.chg .floor{fill:var(--chg)}
.v-side .body,.v-side .ghost{transition:d .45s cubic-bezier(.3,.7,.2,1),opacity .3s}
.v-side .ghost{transform:none}
.viz .hub{fill:#2f343c}
#sFW,#sRW{transition:transform .45s cubic-bezier(.3,.7,.2,1)}
#sFW.chg .wingp,#sRW.chg .wingp{fill:var(--chg)}
.viz .vt{font:600 11px var(--f-num);fill:var(--muted)}
.viz .vt.big{font-size:12px;fill:var(--fg)}
.viz .vt .chg,.viz .vt.chg{fill:var(--chg)}

const sesTyre = s => s.tyre || TYRES[s.car][0];
const DEF_TRACKS = ['Monza','Imola','Mugello','Misano','Vallelunga','Paul Ricard','Spa-Francorchamps','Red Bull Ring','Barcellona','Hockenheim','Nürburgring','Zandvoort','Hungaroring'];
const TABS = {calc:'Calcolo', reg:'Registra run', hist:'Storico', temp:'T Track / T Air', base:'Base pista'};

let S = {
  car:'gt3', track:'Monza', cond:'dry', tab:'calc',
  sessions:[], bases:{}, prefs:{tracks:[], coef:{}},
  inp:{tt:20, ta:20, trim:[20,20,20,20], target:null},
  mode:'local', col:null
};

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : NaN; };
const f2 = n => isFinite(n) ? n.toFixed(2) : '–';
const f1 = n => isFinite(n) ? n.toFixed(1) : '–';
const sgn = n => (n>0?'+':'') + f2(n);
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const tracks = () => [...new Set([...DEF_TRACKS, ...(S.prefs.tracks||[])])];
const baseKey = (car,track,tyre=tyreOf(car)) => tyre===TYRES[car][0] ? 'base_'+car+'_'+slug(track) : 'base_'+car+'_'+slug(tyre)+'_'+slug(track);
function getBase(car=S.car, track=S.track, tyre=tyreOf(car)){
  const own=S.bases[baseKey(car,track,tyre)]; if(own) return own;
  if(tyre!==TYRES[car][0]){ const d=getBase(car,track,TYRES[car][0]); return {cold:[...d.cold], target:[...d.target], fromTyre:TYRES[car][0]}; }
  return SEED_BASES[car+'|'+track] ? {...SEED_BASES[car+'|'+track], isSeed:true} : {...CARS[car].def, isDefault:true};
}
const coef = (car=S.car) => ({...DEF_COEF[car], ...((S.prefs.coef||{})[car]||{})});
const tol = d => Math.abs(d)<=0.02 ? 'ok' : Math.abs(d)<=0.05 ? 'warn' : 'bad';

/* ---------- modello (dal foglio TYRE PRESSURE) ----------
   Freddo = Base20/20 + (Tamb − 20)·kEnv/10 + (Tcerchio − 20)·kRim/10 − (TargetBase − NuovoTarget)/rapporto
   Tamb = media (T aria + T pista) per la F4, T pista per la GT4.
   Dopo un run: Freddo corretto = Freddo messo − (Caldo − Target)/rapporto,
   riportato a 20/20 e al target base: diventa la nuova Base 20/20 per quella pista e condizione.
*/
function history(car=S.car, track=S.track, cond=S.cond, tyre=tyreOf(car)){
  return S.sessions.filter(s=>s.car===car && s.track===track && s.cond===cond && sesTyre(s)===tyre).sort((a,b)=>b.date-a.date);
}
const tenvOf = (car,tt,ta) => CARS[car].air ? (tt+ta)/2 : tt;
const envCorr = (k,tenv,trim) => (tenv-20)*k.kEnv/10 + (trim-20)*k.kRim/10;

// Base 20/20 ricavata da un run, espressa al target base
function base20FromRun(s,i,b,k){
  const corrected = s.cold[i] - (s.hot[i]-s.target[i])/k.ratio;
  return corrected - envCorr(k, tenvOf(s.car,s.tt,s.ta??s.tt), s.trim[i]) + (b.target[i]-s.target[i])/k.ratio;
}
function learnedBase(){
  const b=getBase(), k=coef(), h=history().slice(0, k.mem==='last'?1:3);
  if(!h.length) return null;
  const w=[0.6,0.3,0.1].slice(0,h.length), sw=w.reduce((a,x)=>a+x,0);
  return {cold: C.map((_,i)=> h.reduce((a,s,j)=>a+w[j]*base20FromRun(s,i,b,k),0)/sw), n:h.length};
}
function recommend(){
  const b=getBase(), k=coef(), I=S.inp, L=learnedBase();
  const target = I.target || b.target;
  const tenv = tenvOf(S.car, I.tt, I.ta);
  return C.map((_,i)=>{
    const base20 = L ? L.cold[i] : b.cold[i];
    const cold = base20 + envCorr(k, tenv, I.trim[i]) - (b.target[i]-target[i])/k.ratio;
    return {cold, base:b.cold[i], base20, target:target[i], src:L?L.n:0};
  }).concat([{n:L?L.n:0, tenv}]);
}

/* ---------- persistenza ---------- */
function setSync(t){ $('#sync').textContent=t; }
async function persist(id, data){
  if(S.mode==='cloud'){
    try{ await S.col.doc(id).set(data); return true; }
    catch(e){ toast('Salvataggio non riuscito: '+(e.code||'errore')); return false; }
  }
  const all = lsGet('pg_docs',{}); all[id]=data; lsSet('pg_docs',all); ingest(all); return true;
}
async function remove(id){
  if(S.mode==='cloud'){ try{ await S.col.doc(id).delete(); }catch(e){ toast('Eliminazione non riuscita'); } return; }
  const all=lsGet('pg_docs',{}); delete all[id]; lsSet('pg_docs',all); ingest(all);
}
function stable(v){ if(Array.isArray(v)) return '['+v.map(stable).join(',')+']'; if(v&&typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}'; return JSON.stringify(v??null); }
function ingest(docs){
  const ses=[], bases={}, events={}, tlog={}; let prefs=null;
  Object.entries(docs).forEach(([id,d])=>{
    if(!d) return;
    if(d.kind==='session') ses.push({...d, id});
    else if(d.kind==='base') bases[id]=d;
    else if(d.kind==='tlog') tlog[id]=d;
    else if(d.kind==='event'){ const {kind,...e}=d; events[id]={...e, id}; }
    else if(id==='prefs') prefs=d;
  });
  ses.sort((a,b)=>a.id<b.id?-1:1);
  if(typeof evDirty==='function' && S.events){ Object.keys(S.events).forEach(id=>{ if(evDirty(id)) events[id]=S.events[id]; }); Object.keys(events).forEach(id=>{ if(!S.events[id] && evDirty(id)) delete events[id]; }); }
  const nextPrefs = prefs ? {...S.prefs, ...prefs} : S.prefs;
  const sig = x => stable({s:[...x.s].sort((a,b)=>a.id<b.id?-1:1), b:x.b, e:x.e, t:x.t||{}, p:(({kind,...r})=>r)(x.p||{})});
  // salta il ridisegno se arriva solo l'eco di un nostro salvataggio (non perdi il campo in cui scrivi)
  if(S._loaded && sig({s:ses,b:bases,e:events,t:tlog,p:nextPrefs})===sig({s:S.sessions,b:S.bases,e:S.events||{},t:S.tlog,p:S.prefs})) return;
  S._loaded=true;
  S.sessions=ses; S.bases=bases; S.events=events; S.tlog=tlog; S.prefs=nextPrefs;
  if(S.evId && !events[S.evId]) S.evId=null;
  if(!S.evId){ const l=Object.values(events).filter(e=>e.car==='gt3').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created); if(l[0]) S.evId=l[0].id; }
  render();
}
async function initStore(){
  const use = window.claude && window.claude.use;
  let db=null, uid=null;
  if(use){ try{ const [u,d] = await Promise.all([use('user'), use('db')]); db=d; uid = u ? await u.id() : null; }catch(e){} }
  if(db && uid){
    S.mode='cloud'; S.col=db.collection('data/users/'+uid);
    setSync('Caricamento dati…');
    const timer=setTimeout(()=>setSync('Dati non ancora raggiungibili'),10000);
    S.col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(timer); setSync('Salvato nel tuo account'); }
      const docs={}; snap.docs.forEach(d=>docs[d.id]=d.data()); ingest(docs);
    }, e=>{ clearTimeout(timer); setSync('Archivio non disponibile'); });
  } else {
    S.mode='local'; setSync('Salvato su questo dispositivo'); ingest(lsGet('pg_docs',{}));
  }
}

/* ---------- temperature battistrada (pirometro): interno / centro / esterno ---------- */
const PYRO_K=['i','c','o'], PYRO_N={i:'Int.',c:'Centro',o:'Est.'};
function pyroCfg(){ const p=(S.prefs&&S.prefs.pyro)||{}, g=(k,d)=>isFinite(num(p[k]))?num(p[k]):d;
  return {opt:g('opt',10), alarm:g('alarm',20), wmin:g('wmin_'+S.car+'_'+tyreOf(),g('wmin_'+S.car,75)), wmax:g('wmax_'+S.car+'_'+tyreOf(),g('wmax_'+S.car,95))}; }
function pyroEval(t){
  const [I,Cc,O]=t||[], cfg=pyroCfg();
  if(![I,Cc,O].every(isFinite)) return null;
  const d=I-O, mid=(I+O)/2, dc=Cc-mid, avgT=(I+Cc+O)/3, lo=cfg.opt-5, hi=cfg.opt+5;
  let cam, camCls;
  if(d<0){ cam='TOO LITTLE'; camCls='bad'; }
  else if(d>=cfg.alarm){ cam='TOO MUCH'; camCls='bad'; }
  else if(d>hi){ cam='HIGH'; camCls='warn'; }
  else if(d<lo){ cam='LOW'; camCls='warn'; }
  else { cam='OK'; camCls='ok'; }
  let pr, prCls;
  if(Cc>Math.max(I,O)){ pr='OVER'; prCls='bad'; }
  else if(Cc<Math.min(I,O)){ pr='UNDER'; prCls='bad'; }
  else { pr='OK'; prCls='ok'; }
  let win, winCls;
  if(avgT<cfg.wmin){ win='COLD'; winCls='bad'; } else if(avgT>cfg.wmax){ win='HOT'; winCls='bad'; } else { win='OK'; winCls='ok'; }
  return {d, dc, avgT, cam, camCls, pr, prCls, win, winCls};
}
function pyroBars(t, side){
  // ordine visivo dall'esterno verso l'interno vettura: ruote di sinistra Est-Centro-Int, di destra Int-Centro-Est
  const order = side===0 ? ['o','c','i'] : ['i','c','o'], v={i:t[0],c:t[1],o:t[2]};
  const vals=order.map(k=>v[k]).filter(isFinite); if(vals.length<3) return '<div class="pbars empty">inserisci i tre valori</div>';
  const mn=Math.min(...vals)-4, mx=Math.max(...vals)+2;
  return `<svg class="pbars" viewBox="0 -10 120 64" aria-hidden="true">${order.map((k,j)=>{ const h=6+44*(v[k]-mn)/(mx-mn||1);
    return `<rect x="${6+j*38}" y="${52-h}" width="32" height="${h}" rx="2" class="pb ${k}"/><text x="${22+j*38}" y="${48-h}" text-anchor="middle">${Math.round(v[k])}</text>`; }).join('')}</svg>`;
}
const PYRO_M=[['pr','INFLATION OK?'],['cam','CAMBER OK?'],['win','IN WINDOW?']];
function pyroMatrix(ev, idp){
  return `<div class="pmat">${PYRO_M.map(([k,h])=>`<div class="pmc"><div class="pmh">${h}</div><div class="pm4">${[0,1,2,3].map(i=>{ const e=ev[i];
    return `<div class="pc ${e?e[k+'Cls']:'na'}"${idp?` id="${idp}${k}${i}"`:''} title="${CN[C[i]]}">${e?e[k]:'–'}</div>`; }).join('')}</div></div>`).join('')}</div>`;
}
function pyroPanel(D){
  const cfg=pyroCfg(), has=(D.pyro||[]).some(t=>t.some(isFinite));
  const cards=C.map((c,i)=>{ const side=i%2, t=D.pyro[i], order=side===0?['o','c','i']:['i','c','o'];
    return `<div class="pcard" style="grid-column:${side?2:1}">
      <div class="t-h"><span class="name">${CN[c]}</span><span class="chip" id="pyA${i}">–</span></div>
      <div class="pin3">${order.map(k=>`<div class="field"><label class="lbl" for="p${k}${i}">${PYRO_N[k]}<span class="u"> °C</span></label>${inp('p'+k+i, t[PYRO_K.indexOf(k)])}</div>`).join('')}</div>
      <div id="pyB${i}">${pyroBars(t,side)}</div></div>`; }).join('');
  return `<details class="pyro"${has?' open':''}><summary><span>Temperature battistrada · interno / centro / esterno</span><span class="muted">facoltativo</span></summary>
    <div class="note">Misura con il pirometro appena la vettura rientra, sempre nello stesso ordine. Inflation: centro più caldo dei lati = OVER, più freddo = UNDER. Camber: ΔT interno − esterno ottimale ${f1(cfg.opt)} ±5 °C, TOO MUCH da ${f1(cfg.alarm)} °C. Window ${esc(tyreOf())}: media dei tre valori fra ${f1(cfg.wmin)} e ${f1(cfg.wmax)} °C.</div>
    ${pydBar()}
    <div id="pyM">${pyroMatrix(D.pyro.map(pyroEval))}</div>
    <div class="pgrid">${cards}</div>
    <div class="paxle" id="pyAx"></div>
    <div class="grid3 pcfg"><div class="field"><label class="lbl" for="pyOpt">ΔT ottimale °C</label>${inp('pyOpt',cfg.opt)}</div>
      <div class="field"><label class="lbl" for="pyAlarm">ΔT allarme °C</label>${inp('pyAlarm',cfg.alarm)}</div>
      <div class="field"><label class="lbl" for="pyWmin">Window min °C</label>${inp('pyWmin',cfg.wmin)}</div>
      <div class="field"><label class="lbl" for="pyWmax">Window max °C</label>${inp('pyWmax',cfg.wmax)}</div></div>
  </details>`;
}
function updatePyro(){
  if(!draft || !draft.pyro) return;
  const ev=draft.pyro.map(pyroEval);
  ev.forEach((e,i)=>{
    const a=$('#pyA'+i), b=$('#pyB'+i); if(!a) return;
    if(b) b.innerHTML=pyroBars(draft.pyro[i], i%2);
    if(!e){ a.className='chip'; a.textContent='–'; return; }
    a.className='chip'; a.textContent=`ΔT ${e.d>0?'+':''}${f1(e.d)} · media ${f1(e.avgT)} °C`;
  });
  const m=$('#pyM'); if(m) m.innerHTML=pyroMatrix(ev); pydUI();
  const ax=(i,j)=>ev[i]&&ev[j]?(ev[i].avgT+ev[j].avgT)/2:NaN, aF=ax(0,1), aR=ax(2,3), el=$('#pyAx');
  if(el) el.innerHTML = isFinite(aF)||isFinite(aR) ? `Media asse anteriore <b>${isFinite(aF)?f1(aF)+' °C':'–'}</b> · posteriore <b>${isFinite(aR)?f1(aR)+' °C':'–'}</b>${isFinite(aF)&&isFinite(aR)?` · differenza ${aF-aR>0?'+':''}${f1(aF-aR)} °C`:''}` : '';
}

/* ---------- dettatura temperature: esterno → centro → interno, giro dalla gomma più caricata ---------- */
// senso di marcia: orario = più curve a destra = gomme sinistre più caricate
const TRACK_DIR={'Monza':'cw','Imola':'ccw','Mugello':'cw','Misano':'cw','Vallelunga':'cw','Paul Ricard':'cw','Spa-Francorchamps':'cw','Red Bull Ring':'cw','Barcellona':'cw','Hockenheim':'cw','Nürburgring':'cw','Zandvoort':'cw','Hungaroring':'cw'};
function trackDir(){ const o=S.prefs&&S.prefs.pyroDir&&S.prefs.pyroDir[S.track]; return o||TRACK_DIR[S.track]||'cw'; }
function pydSeq(){ const t=trackDir()==='cw'?[0,2,3,1]:[1,3,2,0], q=[]; t.forEach(i=>['o','c','i'].forEach(k=>q.push([i,k]))); return q; }
const PYD={on:false,pos:0,eng:null,sr:null,partial:'',bound:false};
(async()=>{ try{ if(window.claude&&window.claude.use){ PYD.eng=await window.claude.use('dictation'); } }catch(e){} })();
function pydSupported(){ return !!(PYD.eng||window.SpeechRecognition||window.webkitSpeechRecognition); }
function pydFirstEmpty(){ const q=pydSeq(); const j=q.findIndex(([i,k])=>!isFinite(draft.pyro[i][PYRO_K.indexOf(k)])); return j<0?0:j; }
const IT_U={uno:1,un:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9};
const IT_T={vent:20,trent:30,quarant:40,cinquant:50,sessant:60,settant:70,ottant:80,novant:90};
const IT_S={zero:0,dieci:10,undici:11,dodici:12,tredici:13,quattordici:14,quindici:15,sedici:16,diciassette:17,diciotto:18,diciannove:19};
function itNum(w){
  w=w.normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(w==='cento') return 100;
  if(w.startsWith('cento')){ const r=itNum(w.slice(5)); return r==null?null:100+r; }
  if(w in IT_S) return IT_S[w]; if(w in IT_U) return IT_U[w];
  for(const st in IT_T){ if(w.startsWith(st)){ let r=w.slice(st.length);
    if(r==='a'||r==='i') return IT_T[st];
    if((r[0]==='a'||r[0]==='i')&&r.length>1) r=r.slice(1);
    return r in IT_U ? IT_T[st]+IT_U[r] : null; } }
  return null;
}
function pydParse(text){
  const out=[]; let t=' '+text.toLowerCase()+' ';
  t=t.replace(/(\d),(\d)(?!\d)/g,'$1.$2').replace(/°c?|gradi/g,' ');
  const tok=t.split(/[\s,;:\/–-]+/).filter(Boolean);
  for(let j=0;j<tok.length;j++){ const w=tok[j];
    if(/^(indietro|annulla|cancella)$/.test(w)){ out.push({cmd:'back'}); continue; }
    if(/^(stop|fine|basta)$/.test(w)){ out.push({cmd:'stop'}); continue; }
    if(/^(salta|avanti|passa)$/.test(w)){ out.push({cmd:'skip'}); continue; }
    if(w==='virgola' && out.length && out[out.length-1].v!=null && j+1<tok.length){ const n=/^\d+$/.test(tok[j+1])?tok[j+1]:itNum(tok[j+1]); if(n!=null){ out[out.length-1].v=parseFloat(out[out.length-1].v+'.'+n); j++; } continue; }
    if(/^\d+(\.\d+)?$/.test(w)){
      if(/^\d{4,}$/.test(w) && w.length%2===0){ const ch=w.match(/\d\d/g).map(Number); if(ch.every(x=>x>=20)){ ch.forEach(v=>out.push({v})); continue; } }
      out.push({v:parseFloat(w)}); continue; }
    const n=itNum(w); if(n!=null) out.push({v:n});
  }
  // la dettatura a volte spezza i numeri: "80 4" → 84, "100 12" → 112
  const m=[];
  for(const o of out){ const p=m[m.length-1];
    if(p&&p.v!=null&&o.v!=null&&Number.isInteger(p.v)&&Number.isInteger(o.v)&&!p.merged){
      if(p.v>=20&&p.v<=90&&p.v%10===0&&o.v>=1&&o.v<=9){ p.v+=o.v; p.merged=true; continue; }
      if(p.v===100&&o.v>=1&&o.v<=99){ p.v+=o.v; if(o.v%10!==0||o.v<20) p.merged=true; continue; }
    }
    m.push({...o}); }
  return m.filter(o=>o.cmd||(o.v>=10&&o.v<=160)).map(o=>o.cmd?{cmd:o.cmd}:{v:o.v});
}
function pydHear(text){
  if(!PYD.on||!draft) return;
  const q=pydSeq(); PYD.last=text.trim();
  for(const o of pydParse(text)){
    if(o.cmd==='stop'){ pydStop(); break; }
    if(o.cmd==='back'){ if(PYD.pos>0){ PYD.pos--; const [i,k]=q[PYD.pos]; draft.pyro[i][PYRO_K.indexOf(k)]=NaN; const el=$('#p'+k+i); if(el) el.value=''; } continue; }
    if(o.cmd==='skip'){ PYD.pos=Math.min(q.length,PYD.pos+1); continue; }
    if(PYD.pos>=q.length) break;
    const [i,k]=q[PYD.pos]; draft.pyro[i][PYRO_K.indexOf(k)]=o.v; const el=$('#p'+k+i); if(el) el.value=String(o.v); PYD.pos++;
  }
  updatePyro(); pydUI();
  if(PYD.pos>=q.length){ toast('Temperature complete'); pydStop(); }
}
function pydBind(){
  if(PYD.bound||!PYD.eng) return; PYD.bound=true;
  PYD.eng.onFinal(({text})=>{ PYD.partial=''; const t=(text||'').trim(), now=Date.now();
    if(t && t===PYD.lf && now-PYD.lt<600) return; PYD.lf=t; PYD.lt=now; pydHear(text); });
  PYD.eng.onPartial(({text})=>{ PYD.partial=text; pydUI(); });
  PYD.eng.onState(({state,reason})=>{ if(state==='idle'&&PYD.on){ PYD.on=false; if(reason&&!/stopped/.test(reason)) toast(reason==='not_granted'?'Microfono non autorizzato':'Dettatura interrotta'); pydUI(); } });
}
function pydStart(){
  if(!draft) return;
  PYD.pos=pydFirstEmpty(); PYD.on=true; PYD.partial=''; PYD.last='';
  if(PYD.eng){ pydBind(); PYD.eng.start().catch(err=>{ PYD.on=false; pydUI(); toast(err&&err.code==='not_granted'?'Microfono non autorizzato':'Dettatura non disponibile'); }); }
  else { const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ PYD.on=false; toast('Dettatura non disponibile in questo browser'); return; }
    // continuous=false: Chrome su Android in modalità continua ripete i risultati già dati → valori doppi
    const r=new SR(); r.lang='it-IT'; r.continuous=false; r.interimResults=true; r.maxAlternatives=1;
    r.onresult=ev=>{ let part='', fin=''; for(let j=0;j<ev.results.length;j++){ const x=ev.results[j]; if(x.isFinal) fin=x[0].transcript; else part+=x[0].transcript; }
      if(fin && !r.__done){ r.__done=true; PYD.partial=''; pydHear(fin); } else { PYD.partial=part; pydUI(); } };
    r.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ PYD.on=false; toast('Microfono non autorizzato'); pydUI(); } };
    r.onstart=()=>{ r.__done=false; };
    r.onend=()=>{ if(PYD.on){ r.__done=false; try{ r.start(); }catch(e){ PYD.on=false; pydUI(); } } };
    PYD.sr=r; try{ r.start(); }catch(e){ PYD.on=false; toast('Dettatura non disponibile'); } }
  pydUI();
}
function pydStop(){ PYD.on=false; PYD.partial=''; if(PYD.eng){ PYD.eng.stop().catch(()=>{}); } if(PYD.sr){ try{ PYD.sr.stop(); }catch(e){} PYD.sr=null; } pydUI(); }
function pydBar(){
  const dir=trackDir(), q=pydSeq(), first=CN[C[q[0][0]]];
  return `<div class="pyd" id="pyD">
    <button class="btn pydbtn" type="button" data-pyd="toggle" id="pyDbtn"${pydSupported()?'':' disabled title="Dettatura non disponibile in questo browser"'}><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm-7 9a7 7 0 0 0 14 0M12 19v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Detta temperature</span></button>
    <div class="pydinfo"><div class="pydst" id="pyDst"></div>
      <div class="muted">Esterno → centro → interno · ${esc(S.track)}: <button class="linkbtn" type="button" data-pyd="dir">senso ${dir==='cw'?'orario':'antiorario'}</button> · si parte da ${first}, poi ${q.filter((_,j)=>j%3===0).slice(1).map(([i])=>CN[C[i]]).join(', ')}. Comandi: «indietro», «salta», «stop».</div></div></div>`;
}
function pydUI(){
  const b=$('#pyDbtn'), st=$('#pyDst'); document.querySelectorAll('.pyro input.pydcur').forEach(x=>x.classList.remove('pydcur'));
  if(!b) return; b.classList.toggle('on',PYD.on); b.querySelector('span').textContent=PYD.on?'Stop dettatura':'Detta temperature';
  if(!PYD.on){ st.textContent=''; return; }

    st.innerHTML=`Ascolto… prossimo: <b>${CN[C[i]]} · ${PYRO_N[k]}</b>${PYD.partial?` <span class="muted">«${esc(PYD.partial)}»</span>`:(PYD.last?` <span class="muted">· sentito «${esc(PYD.last)}»</span>`:'')}`; }
}

function diffs(a, b){
  const out=[];
  SF.forEach(f=>{
    const sides = f.lr ? [0,1] : [null];
    sides.forEach(sd=>{
      const va = sd==null ? a[f.k] : (a[f.k]||[])[sd], vb = sd==null ? b[f.k] : (b[f.k]||[])[sd];
      if(norm(va)!==norm(vb)) out.push({f, sd, from:va??'', to:vb??''});
    });
  });
  return out;
}

/* ---------- calcoli tecnici ---------- */
function interpRH(tab, rrh, frh){
  const R=AERO.rrh, F=AERO.frh; let out=false;
  let r=rrh, f=frh;
  if(r>R[0]){r=R[0];out=true;} if(r<R[R.length-1]){r=R[R.length-1];out=true;}
  if(f<F[0]){f=F[0];out=true;} if(f>F[F.length-1]){f=F[F.length-1];out=true;}
  let i=0; while(i<R.length-2 && r<R[i+1]) i++;
  let j=0; while(j<F.length-2 && f>F[j+1]) j++;
  const tr=(R[i]-r)/(R[i]-R[i+1]), tf=(f-F[j])/(F[j+1]-F[j]);
  const q=[tab[i][j],tab[i][j+1],tab[i+1][j],tab[i+1][j+1]];
  if(q.some(v=>v==null)){ out=true; const ok=q.filter(v=>v!=null); return {v: ok.length? ok.reduce((a,b)=>a+b,0)/ok.length : NaN, out}; }
  const v=(q[0]*(1-tf)+q[1]*tf)*(1-tr)+(q[2]*(1-tf)+q[3]*tf)*tr;
  return {v, out};
}
function aeroAt(fw, rw, frh, rrh){
  const wi=AERO.rw.indexOf(rw), fi=AERO.fw.indexOf(fw);
  if(wi<0||fi<0||!isFinite(frh)||!isFinite(rrh)) return null;
  const F=interpRH(AERO.rhF,rrh,frh), Z=interpRH(AERO.rhZ,rrh,frh), X=interpRH(AERO.rhX,rrh,frh);
  return { F: AERO.wingF[wi][fi]+F.v, Z: AERO.wingZ[wi][fi]+Z.v-1, X: AERO.wingX[wi][fi]+X.v-1, out:F.out||Z.out||X.out };
}
// Confronto come nel foglio Aerodynamic: delta additivi; correzione T aria (ΔT/100·0,54) su SCz e SCx
function aeroDelta(a, b, tA=NaN, tB=NaN){
  if(!a||!b) return null;
  const tc = (isFinite(tA)&&isFinite(tB)) ? (tB-tA)/100*0.54 : 0;
  const dZ=b.Z-a.Z-tc, dX=b.X-a.X-tc;
  return { dF:b.F-a.F, dZ, dX, eff: (1+dZ)/(1+dX)-1, out:a.out||b.out, tc };
}
function aeroOfSetup(st){ return aeroAt(st.fw, st.rw, avg2(st.rhF), avg2(st.rhR)); }
function avg2(v){ const a=(Array.isArray(v)?v:[v,v]).map(num).filter(isFinite); return a.length? a.reduce((x,y)=>x+y,0)/a.length : NaN; }
function rollStiff(axle, dia, blade){ return (ARB[axle][String(num(dia))]||{})[String(num(blade))] ?? NaN; }
function springRoll(axle, rate, track){ const k=GROUND_K[axle][String(num(rate))]; return (isFinite(k)&&isFinite(track)&&track>0) ? k*track*track/2*Math.PI/180/1000 : NaN; }
function mrbOf(p){
  const aF=rollStiff('F',p.arbF,p.bladeF), aR=rollStiff('R',p.arbR,p.bladeR);
  const arb = aF/(aF+aR)*100;
  const sF=springRoll('F',p.springF,p.trackF), sR=springRoll('R',p.springR,p.trackR);
  const tot = (isFinite(sF)&&isFinite(sR)) ? (aF+sF)/(aF+sF+aR+sR)*100 : NaN;
  return {aF,aR,arb,sF,sR,tot};
}
function mrbOfSetup(st){
  const ve=vehicle(st);
  const r=mechModel({arbF:st.arbF,bladeF:st.bladeF,arbR:st.arbR,bladeR:st.bladeR,springF:avg2(st.springF),springR:avg2(st.springR),pickup:st.pickup,frh:avg2(st.rhF),rrh:avg2(st.rhR),fw:st.fw,rw:st.rw,ta:20}, ve);
  return {arb:r.pArb, sus:r.pSus, tot:r.pTot, lltd:r.lltd, grad:r.grad, vpct:r.vPct, fqF:r.fqF, fqR:r.fqR, rakeS:r.rakeS, rakeD:r.rakeD};
}
function weightsOf(st){
  const c=[...(st.cwF||[]),...(st.cwR||[])].map(num);
  if(c.length<4||c.some(v=>!isFinite(v))) return null;
  const tot=c.reduce((a,b)=>a+b,0);
  return {tot, front:(c[0]+c[1])/tot*100, cross:(c[0]+c[3])/tot*100};
}
const pct = (v,d=1) => isFinite(v) ? (v>0?'+':'')+(v*100).toFixed(d)+' %' : '–';
const sg3 = v => isFinite(v) ? (v>0?'+':'')+v.toFixed(3) : '–';

/* ---------- salvataggio eventi ---------- */
// Salvataggio eventi: uno alla volta per evento, sempre con l'ultimo stato.
// Mentre un evento ha modifiche in attesa, i dati in arrivo dal server non lo sovrascrivono.
const evQ={};
function evDirty(id){ const q=evQ[id]; return !!q && (q.inflight||q.pending||q.waiting); }
function saveEvent(ev, now=false){
  const q=evQ[ev.id]||(evQ[ev.id]={});
  clearTimeout(q.timer); q.waiting=true;
  const go=()=>{ q.waiting=false; flushEvent(ev.id); };
  if(now) go(); else q.timer=setTimeout(go,800);
}
async function flushEvent(id){
  const q=evQ[id]||(evQ[id]={});
  if(q.inflight){ q.pending=true; return; }
  const ev=S.events[id]; if(!ev){ q.pending=false; return; }
  q.inflight=true; q.pending=false;
  const {id:_omit, ...data}=ev;
  const ok=await persist(id, {...JSON.parse(JSON.stringify(data)), kind:'event'});
  if(!ok){ q.failed=(q.failed||0)+1; if(q.failed<5){ q.pending=true; await new Promise(r=>setTimeout(r,1200*q.failed)); } }
  else q.failed=0;
  q.inflight=false;
  if(q.pending) flushEvent(id);
  else if(S.mode==='cloud') setSync('Salvato nel tuo account');
}

    conv:{axle:'F', from:String(avg2(st.springF)), to:'900', wF:avg2(st.cwF), wR:avg2(st.cwR), preload:'1', drh:'2', dcam:'0.5', dtoe:'1', dcas:'0.5', dbr:'1.5'}};
}
function renderCalcMod(){

/* ---------- modello meccanico completo (MTS, Design applicated to Race Engineering, pp. 25, 37, 42, 63-67) ---------- */
// Parametri vettura T-421: carreggiate e passo dalla scheda tecnica Tatuus; i valori "stima" vanno sostituiti con dati misurati
const VEH_DEF = { L:2800, TF:1515, TR:1470, M:'', fF:'', hcg:290, RCF:-3.5, MRF:1.1, MRR:1.23, pF:1.40, pR:1.43, ktF:'', ktR:'', muF:14, muR:16, rF:'', rR:'', kcF:'', kcR:'',
  V:200, P:1013, sczRef:1.0, balRef:40, tgtF:'', tgtR:'', bumpF:'', bumpR:'' };
const VEH_FIELDS = [
  ['Vettura', [['L','Passo','mm'],['TF','Carreggiata ant.','mm'],['TR','Carreggiata post.','mm'],['M','Massa totale','kg','dal turno'],['fF','Peso all’anteriore','%','dal turno'],['hcg','Altezza baricentro','mm','stima']]],
  ['Sospensioni e gomme', [['MRF','Motion ratio ant.',''],['MRR','Motion ratio post.',''],['RCF','Centro di rollio ant. (dal piano di rif.)','mm','manuale T-421'],['pF','Pressione a caldo ant.','bar'],['pR','Pressione a caldo post.','bar'],['ktF','Rigidezza gomma ant.','kg/mm','vuoto = Pirelli ×0,9 (stima)'],['ktR','Rigidezza gomma post.','kg/mm','vuoto = Pirelli'],['kcF','Cedevolezza ant.','kg/mm','vuoto = rigida'],['kcR','Cedevolezza post.','kg/mm','vuoto = rigida']]],
  ['Masse non sospese', [['muF','Non sospesa per ruota ant.','kg','stima'],['muR','Non sospesa per ruota post.','kg','stima'],['rF','Raggio gomma ant. sotto carico','mm','vuoto = post. −16 (stima)'],['rR','Raggio gomma post. sotto carico','mm','vuoto = Pirelli']]],
  ['Aerodinamica e altezze', [['V','Velocità','km/h'],['P','Pressione','mbar'],['sczRef','SCz di riferimento','m²','stima'],['balRef','Bilancio aero di riferimento','% ant.','stima'],['tgtF','Altezza dinamica obiettivo ant.','mm','facoltativo'],['tgtR','Altezza dinamica obiettivo post.','mm','facoltativo'],['bumpF','Luce tampone ant.','mm','facoltativo'],['bumpR','Luce tampone post.','mm','facoltativo']]]
];
const LB2KG = 0.4536/25.4; // lb/in → kg/mm (riproduce la tabella “Ground stiffness” del manuale T-421 §5.4)
// Pirelli 250/575-13 DM su 13x10J (Tyre Data Booklet 2022): rigidezza radiale statica tra 150 e 250 kg, media camber −2°/−4°
const PIR_K = { p:[0.8,1.0,1.2,1.4,1.6,1.8,2.0], k:[12.1,14.1,16.3,18.1,19.4,20.7,22.5] };
// raggio sotto carico a 1,4 bar e 30 km/h
const PIR_R = { load:[25,90,280,420], r:[284.4,280.9,270.0,262.2] };
const lerp = (xs,ys,x) => { if(!isFinite(x)) return NaN; if(x<=xs[0]) return ys[0]; for(let i=1;i<xs.length;i++) if(x<=xs[i]) return ys[i-1]+(ys[i]-ys[i-1])*(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[ys.length-1]; };
const VEH_OLD = {RCF:25, ktF:24, ktR:26, rF:265, rR:280};  // stime della versione precedente: se salvate, si ignorano
const DAN2KG = 1.0197;
function vehicle(st){
  const pv={...((S.prefs||{}).veh||{})}; for(const k in VEH_OLD) if(num(pv[k])===VEH_OLD[k]) delete pv[k];
  const v={...VEH_DEF, ...pv}; const n=k=>num(v[k]);
  const w=st?weightsOf(st):null;
  const M=isFinite(n('M'))?n('M'):(w?w.tot:570), fF=(isFinite(n('fF'))?n('fF'):(w?w.front:42))/100;
  const kPR=lerp(PIR_K.p,PIR_K.k,isFinite(n('pR'))?n('pR'):1.43), kPF=lerp(PIR_K.p,PIR_K.k,isFinite(n('pF'))?n('pF'):1.40)*0.9;
  const rRa=lerp(PIR_R.load,PIR_R.r,M*(1-fF)/2);
  const ktF=n('ktF')>0?n('ktF'):kPF, ktR=n('ktR')>0?n('ktR'):kPR, rR=n('rR')>0?n('rR'):rRa, rF=n('rF')>0?n('rF'):rR-16;
  return {L:n('L'),TF:n('TF'),TR:n('TR'),M,fF,hcg:n('hcg'),RCF:n('RCF'),MRF:n('MRF'),MRR:n('MRR'),ktF,ktR,kcF:n('kcF'),kcR:n('kcR'),
    muF:n('muF'),muR:n('muR'),rF,rR,V:n('V'),P:n('P'),sczRef:n('sczRef'),balRef:n('balRef')/100,tgtF:n('tgtF'),tgtR:n('tgtR'),bumpF:n('bumpF'),bumpR:n('bumpR'),fromTurn:!isFinite(n('M'))&&!!w};
}
const ser = (...k) => { const f=k.filter(x=>isFinite(x)&&x>0); return f.length ? 1/f.reduce((a,x)=>a+1/x,0) : NaN; };
const rollK = (k,T) => k*T*T/2/1000/57.3;          // kg/mm per ruota → kg·m/° per asse (MTS p.37)
// c: configurazione (barre, molle, attacco, altezze statiche, ali, T aria); ve: parametri vettura
function mechModel(c, ve){
  const r={};

  r.kwF=num(c.springF)*LB2KG/(ve.MRF*ve.MRF); r.kwR=num(c.springR)*LB2KG/(ve.MRR*ve.MRR);
  r.kvF=ser(r.kwF, ve.ktF, ve.kcF); r.kvR=ser(r.kwR, ve.ktR, ve.kcR);
  r.vPct=r.kvF/(r.kvF+r.kvR)*100;
  // --- rigidezze a rollio [kg·m/°] (MTS p.37, p.64): molle e barra in parallelo, gomma e cedevolezza in serie
  r.sF=rollK(r.kwF,ve.TF); r.sR=rollK(r.kwR,ve.TR);
  r.aF=rollStiff('F',c.arbF,c.bladeF)*DAN2KG; r.aR=rollStiff('R',c.arbR,c.bladeR)*DAN2KG;
  r.tF=rollK(ve.ktF,ve.TF); r.tR=rollK(ve.ktR,ve.TR);
  r.cF=isFinite(ve.kcF)&&ve.kcF>0?rollK(ve.kcF,ve.TF):NaN; r.cR=isFinite(ve.kcR)&&ve.kcR>0?rollK(ve.kcR,ve.TR):NaN;
  r.KF=ser(r.sF+r.aF, r.tF, r.cF); r.KR=ser(r.sR+r.aR, r.tR, r.cR);
  r.pArb=r.aF/(r.aF+r.aR)*100; r.pSus=(r.sF+r.aF)/(r.sF+r.aF+r.sR+r.aR)*100; r.pTot=r.KF/(r.KF+r.KR)*100;
  // --- masse e trasferimento laterale a 1 g (MTS p.42)
  const WF=ve.M*ve.fF, WR=ve.M-WF, MsF=WF-2*ve.muF, MsR=WR-2*ve.muR, Ms=MsF+MsR;
  r.WF=WF; r.WR=WR;
  const hs=(ve.M*ve.hcg-2*ve.muF*ve.rF-2*ve.muR*ve.rR)/Ms, aS=ve.L*MsR/Ms;
  const pk=PICKUP[c.pickup]; r.RCR=pk?pk[0]:NaN; r.antiLift=pk?pk[1]:NaN; r.antiSquat=pk?pk[2]:NaN;
  // manuale T-421 §5.7.3: centri di rollio riferiti al piano di riferimento → da terra si somma l'altezza statica
  const fh0=isFinite(num(c.frh))?num(c.frh):15, rh0=isFinite(num(c.rrh))?num(c.rrh):35;
  r.rcgF=ve.RCF+fh0; r.rcgR=r.RCR+rh0; r.ktF=ve.ktF; r.ktR=ve.ktR; r.rF=ve.rF; r.rR=ve.rR;
  const hra=r.rcgF+(r.rcgR-r.rcgF)*aS/ve.L;
  r.Mroll=Ms*(hs-hra)/1000;                       // kg·m per g
  r.grad=r.Mroll/(r.KF+r.KR);                     // °/g
  r.elF=r.Mroll*1000*r.KF/(r.KF+r.KR)/ve.TF; r.elR=r.Mroll*1000*r.KR/(r.KF+r.KR)/ve.TR;
  r.geF=MsF*r.rcgF/ve.TF; r.geR=MsR*r.rcgR/ve.TR;
  r.unF=2*ve.muF*ve.rF/ve.TF; r.unR=2*ve.muR*ve.rR/ve.TR;
  r.dWF=r.elF+r.geF+r.unF; r.dWR=r.elR+r.geR+r.unR; r.lltd=r.dWF/(r.dWF+r.dWR)*100;
  // --- frequenze proprie
  const fr=(k,m)=>Math.sqrt(k*9.81*1000/m)/(2*Math.PI);
  r.fqF=fr(r.kvF,MsF/2); r.fqR=fr(r.kvR,MsR/2);
  // --- carico aero e altezze dinamiche (MTS p.65): abbassamento = carico per ruota / rigidezza
  // manuale T-421 §4.1: +5 °C da ISA = −2,7 % (−0,54 %/°C); +10 mbar = +1 %
  const T=num(c.ta), Tt=isFinite(T)?T:15, Pp=isFinite(ve.P)?ve.P:1013.25, Vm=ve.V/3.6;

    const tot=q*ve.sczRef*A.Z/9.81, bal=ve.balRef*(1+A.F); return {tot, bal, F:tot*bal, R:tot*(1-bal), out:A.out}; };
  const sF=num(c.frh), sR=num(c.rrh);
  let dF=sF, dR=sR, ae=null;
  for(let i=0;i<6;i++){ ae=aeroAtRH(dF,dR); if(!ae) break; dF=sF-ae.F/2/r.kvF; dR=sR-ae.R/2/r.kvR; }
  if(ae){ r.aeTot=ae.tot; r.aeF=ae.F; r.aeR=ae.R; r.aeBal=ae.bal*100; r.aeOut=ae.out;
    r.defF=ae.F/2/r.kvF; r.defR=ae.R/2/r.kvR; r.dynF=sF-r.defF; r.dynR=sR-r.defR;
    r.dmpF=ae.F/2/r.kwF/ve.MRF; r.dmpR=ae.R/2/r.kwR/ve.MRR; }

  r.rakeS=sR-sF; r.rakeD=r.dynR-r.dynF;
  r.rakeSdeg=Math.atan(r.rakeS/ve.L)*57.3; r.rakeDdeg=Math.atan(r.rakeD/ve.L)*57.3;

  r.bumpHitF=isFinite(ve.bumpF)&&r.dmpF>ve.bumpF; r.bumpHitR=isFinite(ve.bumpR)&&r.dmpR>ve.bumpR;
  return r;
}

function updateConv(){
  const v=S.calc.conv, ax=v.axle, mr=MRATIO[ax];
  const kgmm=lb=>num(lb)*LB2KG;
  const w=num(ax==='F'?v.wF:v.wR);
  const set=(id,h)=>{const e=$('#'+id); if(e) e.innerHTML=h;};
  if(isFinite(w)&&w>0){
    const d1=w/kgmm(v.from)*mr, d2=w/kgmm(v.to)*mr, dr=d1-d2;
    set('cvSpring',`Compressione ${d1.toFixed(1)} → ${d2.toFixed(1)} mm: l'altezza ${dr>=0?'sale':'scende'} di <b>${Math.abs(dr).toFixed(1)} mm</b> per lato a parità di regolazione.`);
  } else set('cvSpring','Inserisci il peso ruota.');
  const f=(x,d=2)=>isFinite(x)?x.toFixed(d):'–';
  set('cvPre',`Ant. ${f(num(v.preload)*ADJ.preloadPitch*MRATIO.F,1)} mm · Post. ${f(num(v.preload)*ADJ.preloadPitch*MRATIO.R,1)} mm di altezza`);
  const drh=num(v.drh); set('cvRh',`Ant. ${f(drh/ADJ.rhTurn.F)} giri (${f(drh/ADJ.rhTurn.F*6,1)} facce) · Post. ${f(drh/ADJ.rhTurn.R)} giri (${f(drh/ADJ.rhTurn.R*6,1)} facce)`);
  const dc=num(v.dcam); set('cvCam',`Ant. ${f(dc/ADJ.camberMm.F,1)} mm di spessori · Post. ${f(dc/ADJ.camberMm.R,1)} mm`);
  const dt=num(v.dtoe); set('cvToe',`Ant. ${f(dt/ADJ.toeTurn.F*6,1)} facce · Post. ${f(dt/ADJ.toeTurn.R*6,1)} facce`);
  set('cvCas',`${f(num(v.dcas)/ADJ.casterTurn)} giri`);
  set('cvBr',`${f(num(v.dbr)/ADJ.brakeTurn)} giri ${num(v.dbr)>=0?'in senso orario':'in senso antiorario'}`);
}

  const mm = /out|ap/.test(s) ? -Math.abs(n) : /in|ch/.test(s) ? Math.abs(n) : n;

  r.KF=ser2(r.sF+r.aF, roll(ve.kt,ve.TF)); r.KR=ser2(r.sR+r.aR, roll(ve.kt,ve.TR));
  r.pSus=(r.sF+r.aF)/(r.sF+r.aF+r.sR+r.aR)*100; r.pTot=r.KF/(r.KF+r.KR)*100;
  const WF=ve.M*ve.fF, WR=ve.M-WF, msF=WF/2-ve.muF, msR=WR/2-ve.muR;
  r.krF=ser2(r.kwF,ve.kt); r.krR=ser2(r.kwR,ve.kt);
  r.fqF=Math.sqrt(r.krF*1000/msF)/(2*Math.PI); r.fqR=Math.sqrt(r.krR*1000/msR)/(2*Math.PI);
  r.pct=r.kwF/(r.kwF+r.kwR)*100;
  r.dfF=msF*g/r.kwF; r.dfR=msR*g/r.kwR;
  const hra=ve.rcF+(ve.rcR-ve.rcF)*(1-ve.fF), arm=ve.hcg-hra, Mr=ve.M*g*arm/1000;
  r.grad=Mr/(r.KF+r.KR);
  const dF=(Mr*r.KF/(r.KF+r.KR)+WF*g*ve.rcF/1000)/(ve.TF/1000), dR=(Mr*r.KR/(r.KF+r.KR)+WR*g*ve.rcR/1000)/(ve.TR/1000);
  r.lltd=dF/(dF+dR)*100; r.stat=ve.fF*100;
  return r;
}

function updateCalcGT(){
  if(S.stab.calc==='gear'){ const o=$('#gearOut'); if(o) o.innerHTML=gearOutGT(); return; }
  if(S.stab.calc!=='conv') return;
  const v=S.calc.conv, ax=v.axle, set=(id,h)=>{const e=$('#'+id); if(e) e.innerHTML=h;};
  const AX=ax==='F'?'anteriore':'posteriore';
  const pF=num(v.barF), pR=num(v.barR), b=pF/(pF+pR)*100, hyd=num(v.hyd);
  set('cgBias', `${isFinite(b)?`Da pressioni: <b>${fx(b)} % ant.</b> (coppia ${fx(b/GT.torqueK)} %) · `:''}${isFinite(hyd)?`idraulica ${fx(hyd)} % → coppia <b>${fx(torqueGT(hyd))} %</b>`:''}`||'Inserisci i valori.');
  const mb=mcBalGT(v.mcF,v.mcR);
  set('cgMc', `Ripartizione a barra centrata: <b>${fx(mb)} % ant.</b> · pressione ant./post. ${fx((num(v.mcR)/num(v.mcF))**2,3)}:1. Pompa più piccola = più pressione su quell'asse.`);
  const t=num(v.toe), tt=t/GT.toeTurn[ax], faces=tt*6;
  set('cgToe', isFinite(tt) ? `Asse ${AX}: <b>${fx(Math.abs(tt),2)} giri</b> (${fx(Math.abs(faces),1)} facce del dado) · ${fx(toeDegGT(t),3)}° per ruota · camber indotto ${sgx(Math.abs(tt)*GT.camberToe[ax]*Math.sign(t),3)}°` : 'Inserisci il Δ al cerchio.');
  const dh=num(v.drh), turns=dh/GT.rhTurn[ax];
  set('cgRh', isFinite(turns) ? `Asse ${AX}: <b>${fx(Math.abs(turns),2)} giri</b> di piattello (${GT.rhTurn[ax]} mm per giro) per ${dh>=0?'alzare':'abbassare'} di ${fx(Math.abs(dh))} mm.` : 'Inserisci il Δ altezza.');
  const ses=curSession(), ve=vehGT(ses?ses.setup:null), d2=ax==='F'?ve.dwF:ve.dwR;
  const W=(ax==='F'?ve.M*ve.fF/2-ve.muF:ve.M*(1-ve.fF)/2-ve.muR);
  const d1=W*9.81/(num(v.from)*d2**2), dd=W*9.81/(num(v.to)*d2**2), dr=d1-dd;
  set('cgSpr', isFinite(dr) ? `Asse ${AX}: schiacciamento ${fx(d1)} → ${fx(dd)} mm, l'altezza ${dr>=0?'sale':'scende'} di <b>${fx(Math.abs(dr))} mm</b> a parità di regolazione (${fx(Math.abs(dr)/GT.rhTurn[ax],2)} giri di piattello per riportarla).` : 'Inserisci le due molle.');
  const ck=num(v.camK), dc=num(v.dcam);
  set('cgCam', isFinite(ck)&&ck>0&&isFinite(dc) ? `<b>${fx(Math.abs(dc)/ck,2)} mm</b> di spessore ${dc<0?'(più camber negativo)':'(meno camber negativo)'} sull'asse ${AX}.` : 'Serve il coefficiente ° per mm: il foglio Correlation_Change lo lascia vuoto.');
  const pads=[['Ant. int.',v.padFi],['Ant. est.',v.padFo],['Post. int.',v.padRi],['Post. est.',v.padRo]].filter(([,x])=>isFinite(num(x)));
  set('cgPad', pads.length ? pads.map(([l,x])=>{ const r=num(x)-GT.padLimit; return `${l} <b class="${r<1.5?'warn':''}">${fx(r)} mm</b> sopra il limite`; }).join(' · ') : 'Inserisci gli spessori misurati.');
}

const TRACK_GEO={'Monza':[45.6156,9.2811],'Imola':[44.3439,11.7167],'Mugello':[43.9975,11.3719],'Misano':[43.9614,12.6833],'Vallelunga':[42.1592,12.3683],'Paul Ricard':[43.2506,5.7917],'Spa-Francorchamps':[50.4372,5.9714],'Red Bull Ring':[47.2197,14.7647],'Barcellona':[41.5700,2.2611],'Hockenheim':[49.3278,8.5656],'Nürburgring':[50.3356,6.9475],'Zandvoort':[52.3888,4.5409],'Hungaroring':[47.5789,19.2486]};
const TV={date:null, wx:{}, last:{}, err:{}, busy:false, hover:null};
const K_DEF=0.025, A_DEF=2, LAG=45;   // k °C per W/m², scarto base °C, ritardo termico asfalto (min)
const pad2=n=>String(n).padStart(2,'0');

function trackGeo(t){ const p=S.prefs&&S.prefs.trackGeo&&S.prefs.trackGeo[t]; return p||TRACK_GEO[t]||null; }
function tlDoc(track,date){ return (S.tlog||{})[tlId(track,date)]||null; }
function tlDays(track){ const s=new Set();
  Object.values(S.tlog||{}).forEach(d=>{ if(d.track===track&&(d.pts||[]).length) s.add(d.date); });
  S.sessions.forEach(x=>{ if(x.track===track&&isFinite(x.tt)) s.add(ymd(new Date(x.date))); });
  return [...s].sort(); }
// tutte le letture del giorno: run salvati (auto) + manuali + web
function tlPoints(track,date){
  const out=[];
  S.sessions.forEach(x=>{ if(x.track!==track) return; const d=new Date(x.date); if(ymd(d)!==date) return;
    out.push({m:d.getHours()*60+d.getMinutes(), tt:isFinite(x.tt)?x.tt:null, ta:isFinite(x.ta)?x.ta:null, src:'run', car:x.car, id:x.id}); });

}
function tlWx(track,date){ const mem=TV.wx[track]&&TV.wx[track][date]; if(mem) return mem; const d=tlDoc(track,date); return d&&d.wx||null; }
function hAt(arr,m){ if(!arr) return NaN; const h=m/60, i=Math.floor(h), f=h-i; if(i<0) return arr[0]; if(i>=arr.length-1) return arr[arr.length-1]; const a=arr[i], b=arr[i+1]; return isFinite(a)&&isFinite(b)?a+(b-a)*f:(isFinite(a)?a:b); }
function interpPts(pts,m){ if(!pts.length) return NaN; if(m<=pts[0].m) return pts[0].v; if(m>=pts[pts.length-1].m) return pts[pts.length-1].v;
  for(let j=1;j<pts.length;j++) if(m<=pts[j].m){ const a=pts[j-1], b=pts[j]; return a.v+(b.v-a.v)*(m-a.m)/((b.m-a.m)||1); } return NaN; }

    const g=j.results&&j.results[0]; if(!g) return null; const ll=[+g.latitude.toFixed(4), +g.longitude.toFixed(4)];

async function wxFetch(force){
  const track=S.track; if(!track||TV.busy) return;
  if(!force && TV.last[track] && Date.now()-TV.last[track] < 30*60000) return;
  let ll=trackGeo(track); if(!ll) ll=await geocodeTrack(track);
  if(!ll){ TV.err[track]='coordinate della pista non trovate: inseriscile qui sotto'; tvStatus(); return; }
  TV.busy=true; tvStatus();
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${ll[0]}&longitude=${ll[1]}&current=temperature_2m,shortwave_radiation,cloud_cover&hourly=temperature_2m,shortwave_radiation,cloud_cover&past_days=1&forecast_days=2&timezone=auto`;
    const r=await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json();
    const by={}; j.hourly.time.forEach((t,i)=>{ const d=t.slice(0,10), h=+t.slice(11,13); (by[d]=by[d]||{t:Array(24).fill(null),r:Array(24).fill(null),c:Array(24).fill(null)});

      if(isFinite(cur.temperature_2m) && !d.pts.some(p=>p.src==='web'&&Math.abs(p.m-m)<20)) d.pts.push({m, ta:cur.temperature_2m, src:'web'});
      return d; });
    const yest=Object.keys(by).sort().find(x=>x<today);
    if(yest && tlDoc(track,yest)) await tlSave(track,yest,d=>{ d.wx=by[yest]; return d; });
  }catch(e){ TV.err[track]='meteo web non raggiungibile ('+(e.message||'rete')+')'; }
  TV.busy=false; if(S.mod==='press'&&S.tab==='temp') render(); else tvStatus();
}

/* ----- modello: T pista = T aria + a + k·irraggiamento(t−45') + correzione sulle letture di oggi ----- */
function tvFit(track,date){
  const days=tlDays(track).filter(d=>d<date).slice(-3), xs=[], ys=[];
  days.forEach(d=>{ const wx=tlWx(track,d); if(!wx) return;
    tlPoints(track,d).forEach(p=>{ if(p.tt==null) return; const air=p.ta!=null?p.ta:hAt(wx.t,p.m), rad=hAt(wx.r,p.m-LAG); if(isFinite(air)&&isFinite(rad)){ xs.push(rad); ys.push(p.tt-air); } }); });
  const n=xs.length; if(!n) return {a:A_DEF, k:K_DEF, n:0, days:[]};
  const mx=xs.reduce((s,x)=>s+x,0)/n, my=ys.reduce((s,y)=>s+y,0)/n, vx=xs.reduce((s,x)=>s+(x-mx)**2,0)/n;
  let k=K_DEF; if(n>=4 && vx>2000){ k=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/n/vx; k=Math.min(0.045,Math.max(0.008,k)); }
  return {a:my-k*mx, k, n, days};
}
function tvProjection(track,date){
  const wx=tlWx(track,date), pts=tlPoints(track,date).filter(p=>p.tt!=null);
  if(wx && wx.t.some(isFinite)){
    const fit=tvFit(track,date), model=m=>hAt(wx.t,m)+fit.a+fit.k*Math.max(0,hAt(wx.r,m-LAG)||0);

    return {kind:'wx', fit, bias, f:m=>model(m)+bias};
  }
  const prev=tlDays(track).filter(d=>d<date).pop(); if(!prev) return null;
  const pp=tlPoints(track,prev).filter(p=>p.tt!=null).map(p=>({m:p.m, v:p.tt})); if(pp.length<2) return null;
  const off=pts.length?pts.slice(-2).reduce((s,p)=>s+(p.tt-interpPts(pp,p.m)),0)/Math.min(2,pts.length):0;
  return {kind:'prev', prev, bias:off, f:m=>(m<pp[0].m-60||m>pp[pp.length-1].m+60)?NaN:interpPts(pp,m)+off};
}

const NOTE={on:false, target:null, sr:null, bound:false};
function micBtn(target){ return `<button class="btn sm micbtn" type="button" data-dictto="${target}" title="Detta con la voce"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm-7 9a7 7 0 0 0 14 0M12 19v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Detta</span></button>`; }
function noteAppend(text){
  const el=NOTE.target&&document.getElementById(NOTE.target); if(!el||!text) return;
  let t=text.replace(/\s*\b(a capo|nuova riga)\b[.,]?\s*/gi,'\n').trim(); if(!t) return;
  const v=el.value, sep=!v?'':(/\n$/.test(v)?'':(el.tagName==='TEXTAREA'&&/[.!?]$/.test(v.trim())?' ':' '));
  if(!v || /[.!?\n]\s*$/.test(v)) t=t.charAt(0).toUpperCase()+t.slice(1);
  el.value=v+sep+t; el.dispatchEvent(new Event('input',{bubbles:true}));

function noteUI(){ document.querySelectorAll('[data-dictto]').forEach(b=>{ const on=NOTE.on&&b.dataset.dictto===NOTE.target; b.classList.toggle('on',on); b.querySelector('span').textContent=on?'Stop':'Detta'; }); }
function noteStop(){ NOTE.on=false; if(PYD.eng) PYD.eng.stop().catch(()=>{}); if(NOTE.sr){ try{ NOTE.sr.stop(); }catch(e){} NOTE.sr=null; } noteUI(); }
function noteStart(target){
  if(PYD.on) pydStop();
  NOTE.on=true; NOTE.target=target;
  if(PYD.eng){
    if(!NOTE.bound){ NOTE.bound=true;
      PYD.eng.onFinal(({text})=>{ if(NOTE.on) noteAppend(text); });
      PYD.eng.onState(({state,reason})=>{ if(state==='idle'&&NOTE.on){ NOTE.on=false; if(reason&&!/stopped/.test(reason)) toast(reason==='not_granted'?'Microfono non autorizzato':'Dettatura interrotta'); noteUI(); } }); }
    PYD.eng.start().catch(err=>{ NOTE.on=false; noteUI(); toast(err&&err.code==='not_granted'?'Microfono non autorizzato':'Dettatura non disponibile'); });
  } else {
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ NOTE.on=false; toast('Dettatura non disponibile in questo browser'); return; }
    const r=new SR(); r.lang='it-IT'; r.continuous=false; r.interimResults=false;
    r.onresult=ev=>{ if(r.__done) return; for(let j=0;j<ev.results.length;j++){ const x=ev.results[j]; if(x.isFinal){ r.__done=true; noteAppend(x[0].transcript); break; } } };
    r.onerror=ev=>{ if(/not-allowed|service-not-allowed/.test(ev.error)){ NOTE.on=false; toast('Microfono non autorizzato'); noteUI(); } };
    r.onend=()=>{ if(NOTE.on){ r.__done=false; try{ r.start(); }catch(e){ NOTE.on=false; noteUI(); } } };
    NOTE.sr=r; try{ r.start(); }catch(e){ NOTE.on=false; toast('Dettatura non disponibile'); }
  }
  noteUI();
}

  Object.values(S.events||{}).forEach(ev=>{ if((ev.car||'gt3')!==car) return; (ev.sessions||[]).forEach((s,i)=>{ if(!s.created) return; const d=ymd(new Date(s.created)), g=add(d,ev.track||'–'); g.turni.push({...s, ev, prev:i>0?ev.sessions[i-1]:null}); g.events.add(ev.name); }); });

  return Object.values(days).map(g=>{ g.turni.sort((a,b)=>a.created-b.created); g.runs.sort((a,b)=>a.date-b.date);
    const laps=g.turni.map(t=>({t, s:lapSec(t.lap)})).filter(x=>isFinite(x.s)); const best=laps.sort((a,b)=>a.s-b.s)[0];

  const air=wx?Array.from({length:12*4+1},(_,i)=>({m:7*60+i*15})).map(p=>({m:p.m,v:hAt(wx.t,p.m)})).filter(p=>isFinite(p.v)):[];
  const vals=[...tt.map(p=>p.tt),...ta.map(p=>p.ta),...air.map(p=>p.v)]; if(!vals.length) return '';
  let x0=8*60,x1=18*60; pts.forEach(p=>{ x0=Math.min(x0,Math.floor(p.m/60)*60); x1=Math.max(x1,Math.ceil(p.m/60)*60); });
  const W=640,H=190,L=34,R=10,T=10,B=24, y0=Math.floor((Math.min(...vals)-2)/5)*5, y1=Math.max(y0+10,Math.ceil((Math.max(...vals)+2)/5)*5);
  const X=m=>L+(m-x0)/(x1-x0)*(W-L-R), Y=v=>T+(y1-v)/(y1-y0)*(H-T-B), path=a=>a.map((p,i)=>(i?'L':'M')+X(p.m).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
  let s=`<svg viewBox="0 0 ${W} ${H}" class="repchart" role="img" aria-label="Temperature della giornata">`;
  for(let v=y0;v<=y1;v+=(y1-y0>30?10:5)) s+=`<line class="g" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  for(let m=x0;m<=x1;m+=120) s+=`<text class="ax" x="${X(m)}" y="${H-6}" text-anchor="middle">${pad2(m/60)}</text>`;
  const airIn=air.filter(p=>p.m>=x0&&p.m<=x1);
  if(airIn.length>1) s+=`<path class="ln ta" d="${path(airIn)}"/>`;
  if(tt.length>1) s+=`<path class="ln tt" d="${path(tt.map(p=>({m:p.m,v:p.tt})))}"/>`;
  s+=ta.filter(p=>p.src!=='web').map(p=>`<circle class="dt ta" cx="${X(p.m)}" cy="${Y(p.ta)}" r="4"/>`).join('')+tt.map(p=>`<circle class="dt tt" cx="${X(p.m)}" cy="${Y(p.tt)}" r="4.5"/>`).join('');
  return s+'</svg>';
}
function renderRepDay(g){
  const car=CARS[S.car], tt=tlPoints(g.track,g.date).filter(p=>p.tt!=null).map(p=>p.tt), taPts=tlPoints(g.track,g.date).filter(p=>p.ta!=null).map(p=>p.ta);
  const wx=tlWx(g.track,g.date), airW=wx?wx.t.slice(8,19).filter(isFinite):[], airs=[...taPts,...airW];
  const rng=a=>a.length?`${Math.round(Math.min(...a))}–${Math.round(Math.max(...a))}`:'–';
  const conds=[...new Set(g.runs.map(r=>CONDS[r.cond]))];
  const tur=g.turni, first=tur[0], last=tur[tur.length-1];
  const startSetup=first?(first.prev?first.prev.setup:first.setup):null, endSetup=last?last.setup:null;
  const total=first&&last&&first!==last||first&&first.prev?repChanges(startSetup,endSetup):[];
  const chart=repMiniChart(g.track,g.date);
  const noted=[...tur.filter(t=>(t.notes||'').trim()).map(t=>({when:t.created, who:t.name, txt:t.notes})), ...g.runs.filter(r=>(r.note||'').trim()).map(r=>({when:r.date, who:'Run pressioni', txt:r.note}))].sort((a,b)=>a.when-b.when);
  return `<article class="panel rep">
    <div class="rephead"><div><div class="repk">Report giornata</div><h2>${esc(g.track)}</h2>
      <div class="repsub">${esc(dayLong(g.date))} · ${esc(car.name)}${g.events.size?` · ${[...g.events].map(esc).join(', ')}`:''}${conds.length?` · ${conds.join(', ')}`:''}</div></div>
      <div class="repact"><button class="btn sm" type="button" data-rep="back">Tutte le giornate</button><button class="btn sm" type="button" data-rep="print">Stampa / PDF</button></div></div>
    <div class="repkpi">
      <div class="kp best"><span class="lbl">Best lap</span><b>${lapFmt(g.best)}</b><span>${g.bestTurn?esc(g.bestTurn):'inserisci il miglior giro nei turni'}</span></div>
      <div class="kp"><span class="lbl">Gomme</span><b class="sm">${g.tyres.length?esc(g.tyres.join(' · ')):'–'}</b><span>${g.runs.length} run pressioni</span></div>
      <div class="kp"><span class="lbl">Turni</span><b>${tur.length}</b><span>${total.length} modifiche setup in giornata</span></div>
      <div class="kp"><span class="lbl">T pista / T aria</span><b class="sm">${rng(tt)} / ${rng(airs)} °C</b><span>minimo – massimo</span></div>
    </div>
    ${tur.length?`<section class="rsec"><h3>Turni</h3><ol class="rturns">${tur.map(t=>{ const ch=repChanges(t.prev&&t.prev.setup,t.setup), ls=lapSec(t.lap), isBest=isFinite(ls)&&ls===g.best;
      return `<li><div class="rtime">${hm(t.created)}</div><div class="rbody"><div class="rtop"><b>${esc(t.name)}</b>${t.lap?`<span class="lap ${isBest?'is-best':''}">${esc(t.lap)}</span>`:''}${t.temps?`<span class="muted">${esc(t.temps)} °C</span>`:''}${t.setup&&t.setup.tyre?`<span class="chip">${esc(t.setup.tyre)}</span>`:''}</div>
        ${ch.length?`<div class="rchg">${ch.slice(0,8).map(c=>`<span><i>${esc(c.l)}</i> ${c.a} → <b>${c.b}</b></span>`).join('')}${ch.length>8?`<span class="muted">+${ch.length-8} altre</span>`:''}</div>`:`<div class="muted rnone">${t.prev?'nessuna modifica':'setup di partenza'}</div>`}
        ${(t.notes||'').trim()?`<div class="rnote">${(()=>{ const n=t.notes.trim(), l=n.split('\n')[0], cut=l.length>160?l.slice(0,160):l; return esc(cut)+(cut!==n?' …':''); })()}</div>`:''}</div></li>`; }).join('')}</ol></section>`:''}
    ${g.runs.length?`<section class="rsec"><h3>Pressioni</h3><div class="tbl-wrap"><table class="rtab"><thead><tr><th>Ora</th><th>Gomme</th><th>T pista</th><th>Freddo AS · AD / PS · PD</th><th>Caldo</th><th>Scarto dal target</th></tr></thead><tbody>
      ${g.runs.map(r=>`<tr><td>${hm(r.date)}</td><td>${esc(sesTyre(r))}</td><td>${f1(r.tt)}</td><td class="num">${f2(r.cold[0])} · ${f2(r.cold[1])} / ${f2(r.cold[2])} · ${f2(r.cold[3])}</td><td class="num">${f2(r.hot[0])} · ${f2(r.hot[1])} / ${f2(r.hot[2])} · ${f2(r.hot[3])}</td><td>${r.hot.map((v,i)=>`<span class="chip ${tol(v-r.target[i])}">${sgn(v-r.target[i])}</span>`).join(' ')}</td></tr>`).join('')}
      </tbody></table></div>
      ${g.runs.filter(r=>r.pyro).map(r=>`<div class="rpyro"><div class="lbl">Temperature battistrada · run delle ${hm(r.date)}</div>${pyroMatrix(r.pyro.map(t=>pyroEval(t.map(x=>x==null?NaN:x))))}</div>`).join('')}</section>`:''}
    ${chart?`<section class="rsec"><h3>Temperature</h3><div class="tvlegend"><span><i class="sw tt"></i>T pista</span><span><i class="sw ta"></i>T aria</span></div><div class="tvchart rch">${chart}</div></section>`:''}
    ${total.length?`<section class="rsec"><h3>Setup · inizio → fine giornata</h3><div class="tbl-wrap"><table class="rtab"><thead><tr><th>Parametro</th><th>Inizio</th><th>Fine</th></tr></thead><tbody>${total.map(c=>`<tr><td>${esc(c.l)}</td><td>${c.a}</td><td><b>${c.b}</b></td></tr>`).join('')}</tbody></table></div></section>`:''}
    ${noted.length?`<section class="rsec"><h3>Note e feedback pilota</h3>${noted.map(n=>`<div class="rfeed"><div class="rtime">${hm(n.when)}<br><span>${esc(n.who)}</span></div><div>${esc(n.txt).replace(/\n/g,'<br>')}</div></div>`).join('')}</section>`:''}
  </article>`;
}
document.addEventListener('click', e=>{
  const d=e.target.closest&&e.target.closest('[data-repday],[data-rep]'); if(!d) return;
  if(d.dataset.repday){ RP.day=d.dataset.repday; render(); window.scrollTo({top:0}); }
  else if(d.dataset.rep==='back'){ RP.day=null; render(); }
  else if(d.dataset.rep==='print'){ window.print(); }
});
render();
initStore();
</script>
